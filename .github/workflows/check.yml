name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix develop --command ./scripts/check
      - run: nix build
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix develop --command go test -race -parallel 4 -count=5 ./internal/app/
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix run .#openapi-spec && git diff --exit-code testdata/openapi-slurmctld-v0.0.45.json
      - run: nix develop --command just cluster-up
      - run: nix develop --command just cluster-wait
      - run: nix develop --command just cluster-seed
      - run: nix develop --command just cluster-test -v
      - if: failure()
        run: docker compose -f dev/compose/compose.yaml logs
